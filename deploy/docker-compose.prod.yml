# Producción de Balón Turbo (proyecto «balon-turbo»).
# Los puertos se publican SOLO en 127.0.0.1: Docker se salta UFW, nginx es la única entrada.
services:
  game:
    container_name: balon-turbo-game
    build:
      context: ..
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:3001:3001"
    environment:
      PORT: "3000"
      STATS_PORT: "3001"
      DATA_DIR: /data
      NODE_ENV: production
      WORKERS: "3"
      NODE_OPTIONS: --max-old-space-size=2048
    volumes:
      - /var/lib/balon-turbo/data:/data
    mem_limit: 3g
    memswap_limit: 3g
    cpus: 3.5
    pids_limit: 512
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    stop_grace_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
