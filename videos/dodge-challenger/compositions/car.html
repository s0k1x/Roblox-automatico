<!doctype html>
<!--
  Car: one Three.js scene of the 2015 Dodge Challenger LB★Performance model.
  Every frame is render(t): camera shot, light sweep, headlights and flash are pure functions of time.
  Shots sit on the music's bar grid (2.25 s): 0, 4.5, 9, 13.5, 18, 22.5 (payoff), 27 (end card).
-->
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script type="importmap">
      {
        "imports": {
          "three": "./lib/three/three.module.js",
          "three/addons/": "./lib/three/addons/"
        }
      }
    </script>
    <script src="lib/gsap.min.js"></script>
    <style>
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #040405;
      }
      #car-root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #040405;
      }
      #car-canvas {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
        display: block;
      }
    </style>
  </head>
  <body>
    <div
      id="car-root"
      data-composition-id="car"
      data-start="0"
      data-duration="31.5"
      data-width="1920"
      data-height="1080"
    >
      <canvas
        id="car-canvas"
        class="clip"
        data-start="0"
        data-duration="31.5"
        data-track-index="1"
      ></canvas>
    </div>

    <script>
      (function () {
        var root = document.getElementById("car-root");
        var duration = Math.max(0.001, parseFloat(root.dataset.duration) || 31.5);
        var clock = { t: 0 };
        var host = { duration: duration, clock: clock, render: null };
        window.__carScene = host;
        window.__hf = window.__hf || {};
        window.__hf.buildReady = window.__hf.buildReady || {};
        window.__hf.buildReady["car"] = new Promise(function (resolve, reject) {
          host.ready = resolve;
          host.fail = reject;
        });
        var tl = gsap.timeline({ paused: true });
        tl.to(clock, {
          t: duration,
          duration: duration,
          ease: "none",
          onUpdate: function () {
            if (host.render) host.render(clock.t);
          },
        });
        window.__timelines = window.__timelines || {};
        window.__timelines["car"] = tl;
      })();
    </script>

    <script type="module">
      import * as THREE from "three";
      import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
      import { Reflector } from "three/addons/objects/Reflector.js";
      import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
      import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
      import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
      import { OutputPass } from "three/addons/postprocessing/OutputPass.js";
      import { ShaderPass } from "three/addons/postprocessing/ShaderPass.js";

      const host = window.__carScene;
      const W = 1920,
        H = 1080;

      // ---------- small math helpers (pure) ----------
      const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
      const lerp = (a, b, k) => a + (b - a) * k;
      const lerp3 = (a, b, k) => [lerp(a[0], b[0], k), lerp(a[1], b[1], k), lerp(a[2], b[2], k)];
      const smooth = (k) => k * k * (3 - 2 * k);
      const inOut = (k) => (k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2);
      const expoOut = (k) => (k >= 1 ? 1 : 1 - Math.pow(2, -10 * k));
      const sineInOut = (k) => -(Math.cos(Math.PI * k) - 1) / 2;
      const ramp = (t, a, b) => smooth(clamp((t - a) / (b - a)));

      // ---------- renderer ----------
      const renderer = new THREE.WebGLRenderer({
        canvas: document.getElementById("car-canvas"),
        antialias: true,
        preserveDrawingBuffer: true,
        powerPreference: "high-performance",
      });
      renderer.setPixelRatio(1);
      renderer.setSize(W, H, false);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.0;

      const scene = new THREE.Scene();
      const BG = new THREE.Color(0x040405);
      scene.background = BG;
      scene.fog = new THREE.Fog(0x040405, 10, 30);

      // ---------- studio environment: dark room, softbox strips (reflections only) ----------
      const studio = new THREE.Scene();
      studio.background = new THREE.Color(0x000000);
      const strip = (w, h, intensity, pos, look, color = 0xffffff) => {
        const m = new THREE.Mesh(
          new THREE.PlaneGeometry(w, h),
          new THREE.MeshBasicMaterial({ color: new THREE.Color(color).multiplyScalar(intensity), side: THREE.DoubleSide }),
        );
        m.position.set(...pos);
        m.lookAt(...look);
        studio.add(m);
      };
      strip(9, 2.2, 2.2, [0, 7, 0], [0, 0, 0]); // overhead softbox
      strip(0.35, 14, 6, [0, 2.2, 7], [0, 1, 0]); // long side strip +Z
      strip(0.35, 14, 4, [0, 2.2, -7], [0, 1, 0]); // long side strip -Z
      strip(0.5, 6, 5, [8, 2, 3], [0, 1, 0]); // front-right kicker
      strip(0.5, 6, 3.5, [-8, 2, -3], [0, 1, 0]); // rear kicker
      strip(12, 0.25, 4, [-6, 0.5, 0], [0, 0.5, 0], 0xff2a2a); // low red accent line behind
      const pmrem = new THREE.PMREMGenerator(renderer);
      scene.environment = pmrem.fromScene(studio, 0.035).texture;
      scene.environmentIntensity = 1;

      // Direct light for diffuse parts (tyres, interior, plastics)
      const key = new THREE.DirectionalLight(0xfff2e6, 1.2);
      key.position.set(4, 6, 5);
      scene.add(key);
      const rim = new THREE.DirectionalLight(0xbcd2ff, 1.6);
      rim.position.set(-5, 3, -4);
      scene.add(rim);

      // ---------- floor: glossy black with a real reflection ----------
      const mirror = new Reflector(new THREE.PlaneGeometry(80, 80), {
        textureWidth: W / 2,
        textureHeight: H / 2,
        color: 0x7a7a80,
        clipBias: 0.003,
      });
      mirror.rotation.x = -Math.PI / 2;
      mirror.position.y = 0;
      scene.add(mirror);
      // A dark, slightly rough coat over the mirror: dims and softens the reflection
      const coat = new THREE.Mesh(
        new THREE.PlaneGeometry(80, 80),
        new THREE.MeshStandardMaterial({
          color: 0x050506,
          roughness: 0.68,
          metalness: 0.0,
          transparent: true,
          opacity: 0.8,
          depthWrite: false,
          envMapIntensity: 0.07,
        }),
      );
      coat.rotation.x = -Math.PI / 2;
      coat.position.y = 0.001;
      scene.add(coat);

      function radialTexture(stops) {
        const c = document.createElement("canvas");
        c.width = c.height = 256;
        const g = c.getContext("2d");
        const grad = g.createRadialGradient(128, 128, 0, 128, 128, 128);
        for (const [o, col] of stops) grad.addColorStop(o, col);
        g.fillStyle = grad;
        g.fillRect(0, 0, 256, 256);
        const tex = new THREE.CanvasTexture(c);
        tex.colorSpace = THREE.SRGBColorSpace;
        return tex;
      }
      // Contact shadow (baked, elliptical)
      const shadow = new THREE.Mesh(
        new THREE.PlaneGeometry(1, 1),
        new THREE.MeshBasicMaterial({
          map: radialTexture([
            [0, "rgba(0,0,0,0.95)"],
            [0.55, "rgba(0,0,0,0.75)"],
            [1, "rgba(0,0,0,0)"],
          ]),
          transparent: true,
          depthWrite: false,
        }),
      );
      shadow.rotation.x = -Math.PI / 2;
      shadow.position.y = 0.004;
      shadow.scale.set(6.0, 2.9, 1);
      scene.add(shadow);

      // Headlight pools on the floor (additive)
      const poolTex = radialTexture([
        [0, "rgba(255,248,235,0.55)"],
        [0.4, "rgba(255,244,225,0.18)"],
        [1, "rgba(255,240,220,0)"],
      ]);
      const pool = new THREE.Mesh(
        new THREE.PlaneGeometry(1, 1),
        new THREE.MeshBasicMaterial({ map: poolTex, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, opacity: 0 }),
      );
      pool.rotation.x = -Math.PI / 2;
      pool.position.set(5.2, 0.006, 0);
      pool.scale.set(6.5, 4.2, 1);
      scene.add(pool);

      // ---------- the car ----------
      let car;
      const glowSprites = [];
      const lamps = { front: [], rear: [] };
      const tailSprites = [];
      const mats = { head: [], tail: [], paint: [] };
      const lampMeshes = [];
      try {
        const gltf = await new GLTFLoader().loadAsync("assets/models/challenger.glb");
        const model = gltf.scene;
        const box = new THREE.Box3().setFromObject(model);
        const size = box.getSize(new THREE.Vector3());
        const center = box.getCenter(new THREE.Vector3());
        const s = 4.9 / Math.max(size.x, size.z);
        model.scale.setScalar(s);
        model.position.set(-center.x * s, -box.min.y * s, -center.z * s);
        car = new THREE.Group();
        car.add(model);
        car.rotation.y = Math.PI / 2; // nose (+Z in the file) points down +X
        scene.add(car);

        model.traverse((o) => {
          if (!o.isMesh) return;
          o.frustumCulled = true;
          const m = o.material;
          const n = m.name || "";
          // roughness 0 + a direct light = a near-infinite specular pixel that bloom blows into a square
          if (m.roughness !== undefined) m.roughness = Math.max(m.roughness, 0.1);
          if (m.clearcoatRoughness !== undefined) m.clearcoatRoughness = Math.max(m.clearcoatRoughness, 0.06);
          // Transmission needs an extra full-scene pass per frame: swap for plain transparency
          if (m.transmission && m.transmission > 0) {
            m.transmission = 0;
            m.transparent = true;
            m.opacity = n === "Windwos" ? 0.55 : 0.6;
            m.depthWrite = false;
          }
          if (n === "Light" || n === "Lgith_Glass_N") {
            // keep the file's emissive map (white fronts, amber/red rears); only drive its strength
            m.userData.base = m.emissiveIntensity || (n === "Light" ? 4.4 : 1.9);
            m.emissiveIntensity = 0;
            mats.head.push(m);
            lampMeshes.push(o);
            // rear half of the shared lamp map burns red, front stays warm white
            m.onBeforeCompile = (sh) => {
              sh.vertexShader = sh.vertexShader
                .replace("#include <common>", "#include <common>\nvarying float vLampX;")
                .replace("#include <project_vertex>", "#include <project_vertex>\nvLampX = (modelMatrix * vec4(transformed, 1.0)).x;");
              sh.fragmentShader = sh.fragmentShader
                .replace("#include <common>", "#include <common>\nvarying float vLampX;")
                .replace(
                  "#include <emissivemap_fragment>",
                  "#include <emissivemap_fragment>\ntotalEmissiveRadiance *= (vLampX < 0.0) ? vec3(1.0, 0.06, 0.04) : vec3(1.0, 0.97, 0.92);",
                );
            };
          }
          if (n === "Windwos" || n === "Light_Glass" || n === "Lgith_Glass_N") m.envMapIntensity = 0.35; // softbox was burning white squares into the glass
          if (n === "inerior") m.emissiveIntensity = 0.15;
          if (n === "mirror") {
            // mirror glass reflected the softbox as a hard white square
            m.roughness = 0.35;
            m.envMapIntensity = 0.12;
          } // dash screens were blooming through the glass
          if (n === "red_glass") {
            const red = new THREE.MeshStandardMaterial({
              color: 0x400000,
              emissive: new THREE.Color(0xff0000),
              emissiveIntensity: 0.0,
              roughness: 0.15,
              metalness: 0.2,
              transparent: true,
              opacity: 0.85,
            });
            red.userData.base = 0.9; // ACES pushes hot reds to orange: keep it low, bloom does the rest
            o.material = red;
            mats.tail.push(red);
          }
          if (n === "CarPaint" || n === "CarPAint_N") {
            // Black clearcoat paint: let the strips draw long clean lines
            m.roughness = 0.12;
            m.metalness = 0.35;
            m.envMapIntensity = 1.4;
            mats.paint.push(m);
          }
        });

        // Glow cards at the lamps (positions in world space after the nose turns to +X)
        const glowTex = radialTexture([
          [0, "rgba(255,255,255,1)"],
          [0.12, "rgba(255,246,230,0.85)"],
          [0.35, "rgba(255,236,210,0.22)"],
          [1, "rgba(255,230,200,0)"],
        ]);
        const redTex = radialTexture([
          [0, "rgba(255,90,90,1)"],
          [0.15, "rgba(255,30,30,0.7)"],
          [0.45, "rgba(255,0,0,0.15)"],
          [1, "rgba(255,0,0,0)"],
        ]);
        // Find the real lamp centres from the lamp geometry, in world space
        scene.updateMatrixWorld(true);
        const acc = { fl: [], fr: [], rl: [], rr: [] };
        const v = new THREE.Vector3();
        for (const o of lampMeshes) {
          const pos = o.geometry.attributes.position;
          const step = Math.max(1, Math.floor(pos.count / 4000));
          for (let i = 0; i < pos.count; i += step) {
            v.fromBufferAttribute(pos, i).applyMatrix4(o.matrixWorld);
            if (v.x > 1.6) (v.z > 0 ? acc.fl : acc.fr).push(v.clone());
            else if (v.x < -1.6) (v.z > 0 ? acc.rl : acc.rr).push(v.clone());
          }
        }
        const centre = (arr, fallback) => {
          if (!arr.length) return fallback;
          const c = new THREE.Vector3();
          for (const p of arr) c.add(p);
          c.multiplyScalar(1 / arr.length);
          // pick the outermost x (the lens face), not the centroid inside the housing
          let ex = c.x;
          for (const p of arr) ex = c.x > 0 ? Math.max(ex, p.x) : Math.min(ex, p.x);
          c.x = ex;
          return c;
        };
        lamps.front = [centre(acc.fl, new THREE.Vector3(2.4, 0.78, 0.66)), centre(acc.fr, new THREE.Vector3(2.4, 0.78, -0.66))];
        lamps.rear = [centre(acc.rl, new THREE.Vector3(-2.4, 0.86, 0.6)), centre(acc.rr, new THREE.Vector3(-2.4, 0.86, -0.6))];
        window.__carLamps = { front: lamps.front.map((p) => p.toArray()), rear: lamps.rear.map((p) => p.toArray()) };
        for (const p of lamps.front) {
          const sp = new THREE.Sprite(
            new THREE.SpriteMaterial({ map: glowTex, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true, opacity: 0, fog: false }),
          );
          sp.position.copy(p).add(new THREE.Vector3(0.06, 0, 0));
          sp.scale.set(0.42, 0.42, 1);
          scene.add(sp);
          glowSprites.push(sp);
        }
        for (const p of lamps.rear) {
          const tp = new THREE.Sprite(
            new THREE.SpriteMaterial({ map: redTex, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true, opacity: 0, fog: false }),
          );
          tp.position.copy(p).add(new THREE.Vector3(-0.05, 0, 0));
          tp.scale.set(0.55, 0.3, 1);
          scene.add(tp);
          tailSprites.push(tp);
        }
      } catch (err) {
        console.error("[car] model failed to load", err);
        host.fail(err);
        throw err;
      }

      // ---------- camera and post ----------
      const camera = new THREE.PerspectiveCamera(30, W / H, 0.05, 120);
      const composer = new EffectComposer(renderer);
      composer.setPixelRatio(1);
      composer.setSize(W, H);
      composer.addPass(new RenderPass(scene, camera));
      // Clamp HDR and drop NaN/Inf before bloom: one runaway specular pixel otherwise blooms into a hard square
      composer.addPass(
        new ShaderPass({
          uniforms: { tDiffuse: { value: null }, maxV: { value: 4.0 } },
          vertexShader: "varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }",
          fragmentShader:
            "uniform sampler2D tDiffuse; uniform float maxV; varying vec2 vUv; void main(){ vec4 c = texture2D(tDiffuse, vUv); vec3 v = c.rgb; if (!(v.r == v.r) || !(v.g == v.g) || !(v.b == v.b)) v = vec3(0.0); v = max(v, vec3(0.0)); float m = max(v.r, max(v.g, v.b)); if (m > maxV) v *= maxV / m; gl_FragColor = vec4(v, c.a); }",
        }),
      );
      const bloom = new UnrealBloomPass(new THREE.Vector2(W / 2, H / 2), 0.5, 0.45, 0.88);
      composer.addPass(bloom);
      composer.addPass(new OutputPass());

      // ---------- shots ----------
      // Car: nose at +X (x = +2.45), tail at -X, sides at z = ±1.07, roof at y ≈ 1.38
      const SHOTS = [
        // 1 IGNICIÓN: close on the headlight, slow push
        { a: 0, b: 4.5, ease: sineInOut, from: { p: [4.4, 0.62, 2.7], l: [2.3, 0.74, 0.72], f: 27 }, to: { p: [3.55, 0.58, 1.95], l: [2.35, 0.74, 0.7], f: 27 } },
        // 2 DETALLE: low macro track down the flank, nose to tail
        { a: 4.5, b: 9, ease: inOut, from: { p: [2.9, 0.42, 2.25], l: [1.1, 0.5, 0.9], f: 36 }, to: { p: [-0.6, 0.46, 2.4], l: [-1.75, 0.45, 0.95], f: 36 } },
        // 3 WIDEBODY: ground-level nose, rising and arcing to the 3/4
        { a: 9, b: 13.5, ease: inOut, from: { p: [5.7, 0.28, 0.35], l: [0, 0.5, 0], f: 30 }, to: { p: [4.3, 0.62, 3.3], l: [0.1, 0.58, 0], f: 30 } },
        // 4 PERFIL: full profile, trucking left
        { a: 13.5, b: 18, ease: (k) => k, from: { p: [1.7, 0.72, 7.9], l: [0.75, 0.62, 0], f: 31 }, to: { p: [-1.7, 0.72, 7.9], l: [-0.75, 0.62, 0], f: 31 } },
        // 5 TRASERA: tail-lamps, slow pull out under the riser
        { a: 18, b: 22.5, ease: sineInOut, from: { p: [-3.55, 0.82, -2.2], l: [-2.35, 0.8, -0.6], f: 31 }, to: { p: [-5.2, 1.0, -3.4], l: [-1.8, 0.75, -0.2], f: 33 } },
      ];

      function heroCam(t) {
        // 6 PAYOFF: whip orbit from behind to the front 3/4, decelerating hard
        const k = clamp((t - 22.5) / 4.5);
        const e = expoOut(k * 1.15);
        const ang = THREE.MathUtils.degToRad(lerp(-160, 38, e));
        const r = lerp(4.6, 7.4, expoOut(k));
        const y = lerp(0.62, 1.2, expoOut(k));
        // decaying shake on the impact
        const sh = Math.exp(-Math.max(0, t - 22.5) * 7) * 0.06;
        const sx = Math.sin(t * 91.0) * sh,
          sy = Math.sin(t * 77.0 + 1.3) * sh;
        return { p: [r * Math.cos(ang) + sx, y + sy, r * Math.sin(ang)], l: [0, 0.6, 0], f: 32 };
      }
      function endCam(t) {
        // 7 END CARD: front 3/4, wide, car low in frame under the title
        const k = sineInOut(clamp((t - 27) / 4.5));
        return { p: lerp3([7.9, 1.05, 5.1], [8.6, 1.12, 5.6], k), l: [0, 1.25, 0], f: 30 };
      }
      function shotAt(t) {
        if (t >= 27) return endCam(t);
        if (t >= 22.5) return heroCam(t);
        for (const s of SHOTS) {
          if (t < s.b || s === SHOTS[SHOTS.length - 1]) {
            const k = s.ease(clamp((t - s.a) / (s.b - s.a)));
            return { p: lerp3(s.from.p, s.to.p, k), l: lerp3(s.from.l, s.to.l, k), f: lerp(s.from.f, s.to.f, k) };
          }
        }
      }

      // ---------- lights over time ----------
      function headlights(t) {
        if (t < 1.0) return 0;
        // ignition flicker: on, off, on, dip, on
        if (t < 1.07) return 1;
        if (t < 1.17) return 0.05;
        if (t < 1.24) return 1;
        if (t < 1.32) return 0.35;
        if (t >= 27) return 1.15;
        return 1;
      }
      function taillights(t) {
        if (t < 18) return 0.3; // dim running lights before the rear shot
        if (t < 22.5) return lerp(0.35, 1.0, ramp(t, 18.2, 19.4));
        return 0.8;
      }
      function envLevel(t) {
        if (t < 4.5) return lerp(0.08, 0.75, ramp(t, 1.2, 4.2));
        if (t >= 27) return lerp(1.0, 0.45, ramp(t, 27, 28.5));
        return 1.0;
      }
      function exposure(t) {
        let e = 1.05;
        if (t >= 22.5) e += 2.6 * Math.exp(-(t - 22.5) * 6.5); // payoff flash
        if (t >= 9 && t < 9.9) e += 0.5 * Math.exp(-(t - 9.6 > 0 ? t - 9.6 : 99) * 8); // WIDEBODY hit
        return e;
      }

      const tmpL = new THREE.Vector3();
      let lastT = -1;
      host.render = (t) => {
        if (t === lastT) return;
        lastT = t;
        const s = shotAt(t);
        camera.position.set(s.p[0], s.p[1], s.p[2]);
        tmpL.set(s.l[0], s.l[1], s.l[2]);
        camera.lookAt(tmpL);
        camera.fov = s.f;
        camera.updateProjectionMatrix();

        // highlights sweep: turn the environment, not the car
        scene.environmentRotation.set(0, 0.6 + t * 0.16, 0);
        scene.environmentIntensity = envLevel(t);
        key.intensity = 1.2 * envLevel(t);
        rim.intensity = 1.6 * envLevel(t);

        const hl = headlights(t);
        for (const m of mats.head) m.emissiveIntensity = m.userData.base * hl;
        // a lamp glows toward the camera only when the camera sees the lens
        const faceF = clamp((camera.position.x - 2.2) / Math.max(0.001, camera.position.distanceTo(tmpL)) * 3);
        const faceR = clamp((-2.2 - camera.position.x) / Math.max(0.001, camera.position.distanceTo(tmpL)) * 3);
        for (const sp of glowSprites) sp.material.opacity = 0.85 * hl * faceF;
        pool.material.opacity = 0.5 * hl;
        const tlv = taillights(t);
        for (const m of mats.tail) m.emissiveIntensity = m.userData.base * tlv;
        for (const sp of tailSprites) sp.material.opacity = 0.7 * tlv * faceR;

        renderer.toneMappingExposure = exposure(t);
        bloom.strength = t >= 22.5 && t < 23.5 ? 0.5 + 0.6 * Math.exp(-(t - 22.5) * 5) : 0.5;
        composer.render();
      };

      try {
        await renderer.compileAsync(scene, camera);
        host.render(host.clock.t);
        const px = new Uint8Array(4);
        renderer.getContext().readPixels(0, 0, 1, 1, renderer.getContext().RGBA, renderer.getContext().UNSIGNED_BYTE, px);
        host.ready();
      } catch (err) {
        console.error("[car] setup failed", err);
        host.fail(err);
      }
    </script>
  </body>
</html>
