<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script type="importmap">
      {
        "imports": {
          "three": "./lib/three/three.module.js",
          "three/addons/": "./lib/three/addons/"
        }
      }
    </script>
    <script src="lib/gsap.min.js"></script>
    <style>
      :root {
        --ground: #040405;
        --ink: #f4f2ef;
        --accent: #e3262f;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="31.5"
      data-width="1920"
      data-height="1080"
    >
      <!-- 3D: one Three.js scene, camera cut into seven shots on the music's bar grid -->
      <div
        id="car"
        data-composition-id="car"
        data-composition-src="compositions/car.html"
        data-start="0"
        data-duration="31.5"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
        style="z-index: 1"
      ></div>

      <!-- Typography, letterbox, flashes -->
      <div
        id="titles"
        data-composition-id="titles"
        data-composition-src="compositions/titles.html"
        data-start="0"
        data-duration="31.5"
        data-track-index="2"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
        style="z-index: 2"
      ></div>

      <!-- Music bed: "Fusion - Dark Epic Trailer" by E. Erkut (CC BY 3.0), 106.7 BPM, entered on a beat -->
      <audio
        id="music"
        class="clip"
        src="assets/music/fusion.mp3"
        data-start="0"
        data-duration="31.5"
        data-media-start="0.895"
        data-track-index="10"
        data-volume="0.62"
        data-fade-in="0.8"
        data-fade-out="2.2"
        data-automation="{&quot;version&quot;: 1, &quot;lanes&quot;: [{&quot;target&quot;: &quot;volume&quot;, &quot;points&quot;: [{&quot;t&quot;: 0, &quot;v&quot;: 1.0}, {&quot;t&quot;: 1.05, &quot;v&quot;: 1.0}, {&quot;t&quot;: 1.3, &quot;v&quot;: 0.5}, {&quot;t&quot;: 3.4, &quot;v&quot;: 0.5}, {&quot;t&quot;: 3.75, &quot;v&quot;: 1.0}, {&quot;t&quot;: 4.75, &quot;v&quot;: 1.0}, {&quot;t&quot;: 5.0, &quot;v&quot;: 0.5}, {&quot;t&quot;: 6.6, &quot;v&quot;: 0.5}, {&quot;t&quot;: 6.95, &quot;v&quot;: 1.0}, {&quot;t&quot;: 9.25, &quot;v&quot;: 1.0}, {&quot;t&quot;: 9.5, &quot;v&quot;: 0.5}, {&quot;t&quot;: 12.1, &quot;v&quot;: 0.5}, {&quot;t&quot;: 12.45, &quot;v&quot;: 1.0}, {&quot;t&quot;: 13.75, &quot;v&quot;: 1.0}, {&quot;t&quot;: 14.0, &quot;v&quot;: 0.5}, {&quot;t&quot;: 16.6, &quot;v&quot;: 0.5}, {&quot;t&quot;: 16.95, &quot;v&quot;: 1.0}, {&quot;t&quot;: 18.35, &quot;v&quot;: 1.0}, {&quot;t&quot;: 18.6, &quot;v&quot;: 0.5}, {&quot;t&quot;: 20.4, &quot;v&quot;: 0.5}, {&quot;t&quot;: 20.75, &quot;v&quot;: 1.0}, {&quot;t&quot;: 23.05, &quot;v&quot;: 1.0}, {&quot;t&quot;: 23.3, &quot;v&quot;: 0.5}, {&quot;t&quot;: 26.0, &quot;v&quot;: 0.5}, {&quot;t&quot;: 26.35, &quot;v&quot;: 1.0}, {&quot;t&quot;: 31.5, &quot;v&quot;: 1.0}]}]}"
      ></audio>

      <!-- Voiceover (Kokoro em_alex, pitched down, light room) -->
      <audio id="vo1" class="clip" src="assets/voice/vo1.wav" data-start="1.3" data-duration="2.72" data-track-index="11" data-volume="1"></audio>
      <audio id="vo2" class="clip" src="assets/voice/vo2.wav" data-start="5.0" data-duration="2.16" data-track-index="11" data-volume="1"></audio>
      <audio id="vo3" class="clip" src="assets/voice/vo3.wav" data-start="9.5" data-duration="3.21" data-track-index="11" data-volume="1"></audio>
      <audio id="vo4" class="clip" src="assets/voice/vo4.wav" data-start="14.0" data-duration="3.17" data-track-index="11" data-volume="1"></audio>
      <audio id="vo5" class="clip" src="assets/voice/vo5.wav" data-start="18.6" data-duration="2.41" data-track-index="11" data-volume="1"></audio>
      <audio id="vo6" class="clip" src="assets/voice/vo6.wav" data-start="23.3" data-duration="3.27" data-track-index="11" data-volume="1"></audio>

      <!-- Sound design: every hit has a cause on screen -->
      <!-- headlights ignite at 1.0 -->
      <audio id="sfx-ignite" class="clip" src="assets/sfx/glitch-1.mp3" data-start="0.22" data-duration="2.64" data-track-index="12" data-volume="0.35"></audio>
      <!-- cuts: rotate three whoosh takes, peak one frame after the cut -->
      <audio id="sfx-cut1" class="clip" src="assets/sfx/whoosh.mp3" data-start="4.37" data-duration="0.57" data-track-index="12" data-volume="0.55"></audio>
      <audio id="sfx-cut2" class="clip" src="assets/sfx/whoosh-cinematic.mp3" data-start="6.53" data-duration="5.54" data-track-index="13" data-volume="0.45"></audio>
      <audio id="sfx-cut3" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="13.37" data-duration="0.57" data-track-index="12" data-volume="0.55"></audio>
      <audio id="sfx-cut4" class="clip" src="assets/sfx/whoosh.mp3" data-start="17.87" data-duration="0.57" data-track-index="12" data-volume="0.5"></audio>
      <!-- WIDEBODY slam at 9.6 -->
      <audio id="sfx-wide" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="9.56" data-duration="2.12" data-track-index="14" data-volume="0.55"></audio>
      <!-- riser crests on the payoff at 22.5, then the impact -->
      <audio id="sfx-riser" class="clip" src="assets/sfx/riser.mp3" data-start="19.06" data-duration="3.6" data-track-index="13" data-volume="0.6" data-fade-out="0.15"></audio>
      <audio id="sfx-payoff" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="22.46" data-duration="2.12" data-track-index="14" data-volume="0.9"></audio>
      <!-- end card lands at 27.0 -->
      <audio id="sfx-end" class="clip" src="assets/sfx/impact-bass-2.mp3" data-start="25.05" data-duration="2.59" data-track-index="14" data-volume="0.7"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
